<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>College Lost & Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: left rail (desktop) / bottom bar (phone) around one animated content stage; login is a split hero with floating lost-item chips. */
:root{
  --bg:#eaf3f0; --surface:#ffffff; --surface2:#f3f8f6; --line:#d6e4df;
  --fg:#0e1f1c; --muted:#587069;
  --brand:#0b9a89; --brand-ink:#ffffff; --brand-soft:#d5f2ed;
  --hot:#ff6a4d; --hot-soft:#ffe3dc; --sun:#f5b301; --sun-soft:#fff2cc;
  --good:#1f9d57; --good-soft:#d9f4e4; --bad:#d6403a; --bad-soft:#fde0de; --info:#3b6fd8; --info-soft:#dce7fb;
  --shadow:0 10px 30px -12px rgba(14,60,52,.28);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07100e; --surface:#0f1c1a; --surface2:#142624; --line:#223a36;
  --fg:#e6f2ef; --muted:#8aa49e;
  --brand:#2dd4bf; --brand-ink:#04211d; --brand-soft:#0f3a35;
  --hot:#ff8468; --hot-soft:#3b1d17; --sun:#ffc933; --sun-soft:#3a2f0a;
  --good:#4ade80; --good-soft:#12301f; --bad:#ff7b75; --bad-soft:#3a1816; --info:#7fa6ff; --info-soft:#18284a;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  --bg:#07100e; --surface:#0f1c1a; --surface2:#142624; --line:#223a36;
  --fg:#e6f2ef; --muted:#8aa49e;
  --brand:#2dd4bf; --brand-ink:#04211d; --brand-soft:#0f3a35;
  --hot:#ff8468; --hot-soft:#3b1d17; --sun:#ffc933; --sun-soft:#3a2f0a;
  --good:#4ade80; --good-soft:#12301f; --bad:#ff7b75; --bad-soft:#3a1816; --info:#7fa6ff; --info-soft:#18284a;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
html,body{height:100%;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ambient blobs */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:drift 22s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:46vmax;height:46vmax;background:var(--brand);left:-14vmax;top:-12vmax}
.blobs i:nth-child(2){width:34vmax;height:34vmax;background:var(--hot);right:-10vmax;top:18vh;animation-duration:28s;opacity:.28}
.blobs i:nth-child(3){width:28vmax;height:28vmax;background:var(--sun);left:30vw;bottom:-14vmax;animation-duration:31s;opacity:.25}
@keyframes drift{to{transform:translate(6vmax,5vmax) scale(1.15)}}

/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;
  padding:11px 18px;border-radius:12px;font-weight:600;background:var(--brand);color:var(--brand-ink);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px -8px var(--brand)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{box-shadow:var(--shadow)}
.btn.hot{background:var(--hot);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

/* inputs */
label.f{display:grid;gap:6px;font-weight:600;font-size:13px;color:var(--muted)}
.in,select.in,textarea.in{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);outline:0}
textarea.in{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}

/* login */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:center;max-width:1100px;margin:0 auto;padding-block:32px}
.hero h1{font-size:clamp(38px,6vw,68px);line-height:.98;font-weight:800}
.hero h1 em{font-style:normal;color:var(--hot);position:relative;white-space:nowrap}
.hero p{color:var(--muted);max-width:46ch;font-size:17px;margin:18px 0 0}
.brandmark{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;margin-bottom:22px}
.brandmark b{width:38px;height:38px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.floaters{position:relative;height:150px;margin-top:30px;overflow:hidden}
.floaters span{position:absolute;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:600;font-size:13px;animation:bob 5s ease-in-out infinite}
.floaters span svg{color:var(--brand)}
@keyframes bob{50%{transform:translateY(-14px) rotate(-2deg)}}
.logincard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow);animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
.gbtn{width:100%;padding:13px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:600;transition:.2s}
.gbtn:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--brand)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:14px;padding:4px;gap:4px;margin:16px 0}
.seg button{border:0;background:none;padding:10px;border-radius:11px;font-weight:600;cursor:pointer;color:var(--muted);transition:.25s}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 2px 8px -2px rgba(0,0,0,.2)}
.who{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface2);border-radius:14px;margin-top:6px}
.av{width:42px;height:42px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.msg-bad{color:var(--bad);font-size:13px;font-weight:600;min-height:18px;margin-top:8px}

/* shell */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto;padding-block:20px}
nav.rail{position:sticky;top:20px;align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;display:grid;gap:4px;box-shadow:var(--shadow)}
nav.rail .brandmark{margin:6px 6px 14px;font-size:16px}
.nv{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;text-align:left;position:relative;transition:.2s;white-space:nowrap}
.nv:hover{background:var(--surface2);color:var(--fg);transform:translateX(3px)}
.nv.on{background:var(--brand-soft);color:var(--brand)}
.nv .lbl.short{display:none}
.nv .dot{margin-left:auto;background:var(--hot);color:#fff;border-radius:999px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.rail .sp{height:1px;background:var(--line);margin:8px 4px}
main{min-width:0}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.top h2{font-size:clamp(26px,4vw,38px);font-weight:800}
.top p{margin:2px 0 0;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center}
.noanim .rise,.noanim.stage{animation:none}
.stage{animation:enter .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}}
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;transition:transform .25s,box-shadow .25s,border-color .25s}
.tilt{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.tilt:hover{box-shadow:var(--shadow);border-color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.stat b{display:block;font-family:var(--display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-weight:600;font-size:13px}
.stat::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--c,var(--brand));opacity:.18}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1.5px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;transition:.2s;color:var(--muted)}
.chip:hover{border-color:var(--brand);color:var(--fg)}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.p-unclaimed{background:var(--info-soft);color:var(--info)}.p-claimed{background:var(--sun-soft);color:var(--sun)}
.p-returned{background:var(--good-soft);color:var(--good)}.p-expired{background:var(--bad-soft);color:var(--bad)}
.p-lock{background:var(--hot-soft);color:var(--hot)}.p-new{background:var(--brand-soft);color:var(--brand)}
.list{display:grid;gap:12px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ic{width:46px;height:46px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.ic.v{background:var(--hot-soft);color:var(--hot)}
.row{display:flex;gap:14px;align-items:center}
.row>.grow{flex:1;min-width:0}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:4px}
.meta span{display:inline-flex;align-items:center;gap:5px}.meta svg{width:14px;height:14px}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--brand);stroke-linecap:round;stroke-dasharray:125.7;stroke-dashoffset:125.7;animation:fill 1.1s .2s cubic-bezier(.2,.8,.2,1) forwards}
.ring.low .fg{stroke:var(--hot)}
@keyframes fill{to{stroke-dashoffset:var(--off)}}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-family:var(--display)}
.empty{text-align:center;padding:44px 16px;color:var(--muted)}
.empty svg{width:44px;height:44px;color:var(--brand);margin-bottom:8px;animation:bob 4s ease-in-out infinite}
.sec{font-family:var(--display);font-weight:700;font-size:18px;margin:24px 0 12px}
.hint{color:var(--muted);font-size:13px}
.banner{display:flex;gap:12px;align-items:center;background:linear-gradient(100deg,var(--brand-soft),var(--sun-soft));border-radius:18px;padding:14px 18px;margin-bottom:18px;font-weight:600}
.warn{background:var(--sun-soft);color:var(--fg);border-radius:14px;padding:11px 14px;font-size:13px;margin-bottom:14px}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:16px;position:relative}
.tl .s{display:grid;justify-items:center;gap:6px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.tl .s i{width:26px;height:26px;border-radius:50%;background:var(--surface2);border:2px solid var(--line);display:grid;place-items:center;z-index:1;transition:.4s;font-style:normal}
.tl .s::before{content:"";position:absolute;top:12px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.tl .s:first-child::before{display:none}
.tl .s.done{color:var(--fg)}.tl .s.done i{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tl .s.done::before{background:var(--brand)}
.tl .s.now i{animation:pulse 1.6s infinite;box-shadow:0 0 0 6px var(--brand-soft)}
.tl .s i svg{width:14px;height:14px;stroke-width:3}

/* map */
.map{width:100%;max-width:480px;border-radius:18px;background:var(--surface2);border:1.5px solid var(--line);cursor:crosshair;display:block;touch-action:manipulation}
.map .z{fill:var(--surface);stroke:var(--line);stroke-width:1.5;transition:.2s}
.map .z:hover,.map .z.on{fill:var(--brand-soft);stroke:var(--brand)}
.map text{fill:var(--fg);font-family:var(--body);font-weight:600;pointer-events:none}
.map .road{stroke:var(--line);stroke-width:11;stroke-linecap:round;stroke-linejoin:round;fill:none}
.map .dec{fill:var(--line);opacity:.5}.map .z.b{fill:var(--sun-soft)}.map .z.b:hover,.map .z.b.on{fill:var(--brand-soft)}
.map .nrth{font-size:11px;font-weight:700;fill:var(--muted)}.map .nrth-a{stroke:var(--muted);stroke-width:2;fill:none;stroke-linecap:round}
.pin{animation:drop .5s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes drop{from{transform:translateY(-40px) scale(.4);opacity:0}}
.pinlabel{font-weight:600;margin-top:8px;display:flex;gap:6px;align-items:center;color:var(--brand)}

/* modal / toast */
.scrim{position:fixed;inset:0;background:rgba(5,15,13,.55);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:24px;padding:24px;max-width:440px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow);animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both;border:1px solid var(--line)}
.modal h3{font-size:22px;margin-bottom:6px}
.qrbox{display:grid;place-items:center;background:#fff;border-radius:18px;padding:16px;margin:14px 0;width:fit-content;margin-inline:auto;box-shadow:0 0 0 6px var(--brand-soft)}
.qrbox img,.qrbox canvas{display:block;max-width:100%}
#toasts{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;z-index:90;width:max-content;max-width:92vw}
.toast{background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;box-shadow:var(--shadow);animation:rise .4s both}
.toast.out{opacity:0;transform:translateY(10px);transition:.35s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:99}

/* bars */
.bar{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;margin:8px 0;font-size:13px;font-weight:600}
.bar div{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar div i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--sun));animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{width:var(--w)}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px}
td{padding:10px 8px;border-top:1px solid var(--line)}
.scroll{overflow-x:auto}
.meter{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--sun));animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards}
.lb{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}.lb b.rk{width:26px;height:26px;border-radius:50%;background:var(--sun-soft);color:var(--sun);display:grid;place-items:center;font-size:13px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.cmp div{background:var(--surface2);border-radius:12px;padding:10px;font-size:13px}
.cmp small{display:block;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.ok{color:var(--good)}.no{color:var(--bad)}

@media (max-width:860px){
  .login{grid-template-columns:minmax(0,1fr);gap:20px}.floaters{height:110px}
  .shell{grid-template-columns:minmax(0,1fr);padding-bottom:96px}
  nav.rail{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;border-radius:20px 20px 0 0;display:flex;overflow-x:auto;gap:2px;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));scrollbar-width:none}
  nav.rail .brandmark,nav.rail .sp,.nv .lbl.long{display:none}
  .nv .lbl.short{display:inline}.nv{flex:1 0 auto}
  .top{flex-wrap:nowrap;align-items:flex-start}.top>div:first-child{min-width:0;flex:1}.top h2{font-size:28px}
  .nv{flex-direction:column;gap:2px;padding:8px 12px;font-size:11px;min-width:64px;align-items:center}
  .nv:hover{transform:none}.nv .dot{position:absolute;top:2px;right:8px;margin:0}
  .bar{grid-template-columns:96px 1fr 28px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5, now=()=>Date.now();
const fmtDate=d=>{try{return new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}catch(e){return d}};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const ICONS={
 search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',plus:'<path d="M12 5v14M5 12h14"/>',box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',

function memDb(){const data={},subs=[];const notify=p=>subs.filter(s=>s.col===p).forEach(s=>s.run());
 const col=name=>{const api={doc(id){id=id||Math.random().toString(36).slice(2,12);const path=name+'/'+id;
   return{id,path,async get(){const d=data[path];return{id,exists:!!d,data:()=>d}},async set(v){data[path]=JSON.parse(JSON.stringify(v));notify(name)},async update(v){data[path]={...(data[path]||{}),...v};notify(name)},async delete(){delete data[path];notify(name)},
   onSnapshot(n){const s={col:name,run:()=>n({exists:!!data[path],id,data:()=>data[path]})};subs.push(s);s.run();return()=>{}}}},
  async add(v){const r=api.doc();await r.set(v);return r},
  onSnapshot(n){const s={col:name,run:()=>n({docs:Object.keys(data).filter(k=>k.startsWith(name+'/')&&!k.slice(name.length+1).includes('/')).map(k=>({id:k.split('/').pop(),exists:true,data:()=>data[k]}))})};subs.push(s);s.run();return()=>{}}};return api};
 return{collection:col,doc:p=>{const i=p.lastIndexOf('/');return col(p.slice(0,i)).doc(p.slice(i+1))}}}

/* ---------- Supabase adapter: Firestore-style API over one "docs" table, so the app below is unchanged ---------- */
function sbAuth(sb){
  const map=u=>u&&{uid:u.id,displayName:(u.user_metadata&&(u.user_metadata.full_name||u.user_metadata.name))||'',email:u.email||'',photoURL:(u.user_metadata&&(u.user_metadata.avatar_url||u.user_metadata.picture))||''};
  return{
    onAuthStateChanged(cb){let last;sb.auth.onAuthStateChange((_e,s)=>{const id=s&&s.user?s.user.id:null;if(id===last)return;last=id;setTimeout(()=>cb(map(s&&s.user)),0)})},
    /* signInWithOAuth RESOLVES with {error} instead of throwing, so it must be checked or failures are silent */
    async signInWithGoogle(){const r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:'select_account'}}});if(r.error)throw r.error;return r},
    signOut(){return sb.auth.signOut()}}}
function sbDb(sb){
  const rid=()=>(crypto.randomUUID?crypto.randomUUID().replace(/-/g,'').slice(0,20):Math.random().toString(36).slice(2,12)+Date.now().toString(36));
  const clean=v=>JSON.parse(JSON.stringify(v));
  /* One shared realtime channel for the whole table. Row deletes cannot be filtered server-side, so we listen unfiltered
     and match on `col` here (a delete event still carries the primary key, which includes col). Our own writes also ping
     listeners directly, so the screen updates instantly even if realtime is not enabled on the table. */
  const subs=new Set();let ch=null;
  const ping=col=>subs.forEach(s=>{if(s.col===col)s.kick()});
  const openChannel=()=>{if(ch)return;ch=sb.channel('lf-docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{const r=(p.new&&p.new.col)?p.new:p.old;if(r&&r.col)ping(r.col)}).subscribe()};
  const live=(col,run)=>{openChannel();const s={col,kick(){clearTimeout(s.t);s.t=setTimeout(run,40)}};subs.add(s);run();
    return()=>{subs.delete(s);clearTimeout(s.t);if(!subs.size&&ch){sb.removeChannel(ch);ch=null}}};
  const query=(col,flt)=>({
    where(f,op,v){return query(col,[f,v])},
    onSnapshot(next,err){return live(col,async()=>{let b=sb.from('docs').select('id,data').eq('col',col);if(flt)b=b.eq('data->>'+flt[0],String(flt[1]));const r=await b;
      if(r.error){err&&err(r.error);return}next({docs:r.data.map(x=>({id:x.id,exists:true,data:()=>x.data}))})})}});
  const doc=(col,id)=>{id=id||rid();return{id,path:col+'/'+id,
    async get(){const r=await sb.from('docs').select('data').eq('col',col).eq('id',id).maybeSingle();if(r.error)throw r.error;return{id,exists:!!r.data,data:()=>r.data&&r.data.data}},
    async set(v){const r=await sb.from('docs').upsert({col,id,data:clean(v)},{onConflict:'col,id'});if(r.error)throw r.error;ping(col)},
    async update(v){const r=await sb.rpc('doc_update',{p_col:col,p_id:id,p_patch:clean(v)});if(r.error)throw r.error;ping(col)},
    async delete(){const r=await sb.from('docs').delete().eq('col',col).eq('id',id);if(r.error)throw r.error;ping(col)},
    onSnapshot(next,err){return live(col,async()=>{const r=await sb.from('docs').select('data').eq('col',col).eq('id',id).maybeSingle();
      if(r.error){err&&err(r.error);return}next({id,exists:!!r.data,data:()=>r.data&&r.data.data})})}}};
  return{collection:c=>({...query(c),doc:id=>doc(c,id),async add(v){const r=doc(c);await r.set(v);return r}}),doc:p=>{const i=p.lastIndexOf('/');return doc(p.slice(0,i),p.slice(i+1))}}}

async function meFrom(u){
  const me={id:u.uid,name:u.displayName||'',email:u.email||'',avatarUrl:u.photoURL||'',canEdit:false,adminUsername:''};
  try{const d=await S.db.doc('adminAllowlist/'+(u.email||'').toLowerCase()).get();if(d.exists){me.canEdit=true;me.adminUsername=(d.data().username||'').toLowerCase()}}catch(e){}
  return me;
}
async function boot(){
  {const t=store.get('lf_theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}
  const cfg=window.SUPABASE_CONFIG;
  const configured=!!(cfg&&cfg.url&&cfg.anonKey&&!/^(PASTE|YOUR)/i.test(cfg.url)&&!/^(PASTE|YOUR)/i.test(cfg.anonKey));
  /* Google/Supabase send failures back in the URL (query or hash). Read them before the client strips the URL. */
  const urlErr=(()=>{try{const p=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,''));return p.get('error_description')||h.get('error_description')||''}catch(e){return ''}})();
  if(configured&&window.supabase){
    try{S.sb=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});S.auth=sbAuth(S.sb);S.db=sbDb(S.sb);
      renderLogin(1);
      if(urlErr){toast('Sign-in failed: '+urlErr.replace(/\+/g,' '));try{history.replaceState(null,'',location.pathname)}catch(e){}}
      S.auth.onAuthStateChanged(async u=>{if(S.role)return;if(u){try{S.me=await meFrom(u);renderLogin(2)}catch(e){console.error(e);toast('Could not load your account. Please sign in again.');renderLogin(1)}}else{S.me=null;renderLogin(1)}});
      return}catch(e){console.error(e)}
  }
  S.libErr=configured&&!window.supabase;   /* keys are set but the Supabase script did not load (offline or blocked) */
  S.db=memDb();S.demo=true;S.setup=true;renderLogin(1);
}

let subsStarted=false;

function sub(path,key,map){const ref=S.db.collection(path);const q=(S.role!=='admin'&&path==='claims'&&ref.where)?ref.where('studentId','==',S.me.id):ref;UNSUBS.push(q.onSnapshot(s=>{S[key]=s.docs.map(d=>({id:d.id,...d.data()}));if(map)map();changed()},()=>{S[key]=[];changed()}))}
function startApp(){

    sub('items','items');sub('claims','claims');sub('returns','returns');
    UNSUBS.push(S.db.doc('settings/main').onSnapshot(d=>{if(d.exists)S.settings={...S.settings,...d.data()};changed()},()=>{}));

    else sub('data/users/'+S.me.id,'reports',()=>{S.reports=S.reports.filter(r=>r.kind)});

const NAV={student:[['browse','search','Browse found'],['handin','hand','Found an item?'],['lostrep','pin','Report lost'],['myclaims','clock','My claims'],['profile','user','Profile']],
 admin:[['dash','home','Dashboard'],['add','plus','Add item'],['claims','check','Claims'],['matches','spark','Matches'],['students','users','Students'],['handover','log','Handover log'],['reports','chart','Reports'],['settings','shield','Settings']]};
function badge(v){if(S.role!=='admin')return '';if(v==='claims')return S.claims.filter(c=>c.status==='requested').length;return 0}
function draw(){

   ${NAV[S.role].map(([v,i,l])=>`<button class="nv ${S.view===v?'on':''}" data-v="${v}">${ic(i)}<span class="lbl long">${l}</span><span class="lbl short">${({'My claims':'Claims','Report lost':'Lost','Browse found':'Browse','Found an item?':'Found'})[l]||l.split(' ')[0]}</span>${badge(v)?`<span class="dot">${badge(v)}</span>`:''}</button>`).join('')}
   <div class="sp"></div><button class="nv" id="share">${ic('qr')}<span class="lbl long">Share &amp; QR</span><span class="lbl short">Share</span></button><button class="nv" id="out">${ic('out')}<span class="lbl long">Sign out</span><span class="lbl short">Exit</span></button></nav>
   <main><div id="view"></div></main></div>`;

  $('#share').onclick=shareModal;$('#out').onclick=async()=>{UNSUBS.splice(0).forEach(f=>{try{f&&f()}catch(e){}});subsStarted=false;Object.assign(S,{items:[],priv:[],claims:[],answers:[],lost:[],found:[],profiles:[],handovers:[],reports:[]});S.role=null;S.me=null;S.profile=null;S.pick=null;if(S.auth)await S.auth.signOut().catch(()=>{});renderLogin(1)};

function changed(){if(!S.role)return;const live=['browse','myclaims','dash','claims','matches','students','handover','reports','settings'];if(live.includes(S.view)){clearTimeout(changed.t);changed.t=setTimeout(()=>{if(!S.role||!live.includes(S.view))return;/* re-check: the user may have opened a form meanwhile, and repainting would wipe what they typed */paint(false);$$('.nv .dot').forEach(d=>d.remove());NAV[S.role].forEach(([v],i)=>{const n=badge(v);if(n)$$('.nv[data-v]')[i]?.insertAdjacentHTML('beforeend',`<span class="dot">${n}</span>`)})},120)}}
function head(t,p,extra=''){return `<div class="top"><div><h2>${t}</h2>${p?`<p>${p}</p>`:''}</div><div class="tools">${extra}<button class="btn ghost sm" id="theme" title="Toggle theme">${ic('sun')}</button></div></div>`}
function paint(anim=true){

const ROADS='M0 12H400M95 83L335 74M0 222L135 208L270 193M285 254H355M90 20L108 140L125 280L132 430M262 15L270 150L285 300L300 430M188 128L192 200L190 260L204 350L215 430';
const DECOR=[[0,115,95,90],[24,372,90,50],[310,338,40,38],[354,338,40,38],[310,384,84,38],[200,226,18,18],[350,262,40,40]];
function mapSVG(id){return `<svg class="map" id="${id}" viewBox="0 0 400 430" role="img" aria-label="Campus map. Tap to drop a pin.">
 <path class="road" d="${ROADS}"/>${DECOR.map(d=>`<rect class="dec" x="${d[0]}" y="${d[1]}" width="${d[2]}" height="${d[3]}" rx="4"/>`).join('')}<circle class="dec" cx="139" cy="217" r="20"/>
 ${ZONES.map(z=>{const o=z[5]||{},cx=z[1]+z[3]/2,cy=z[2]+z[4]/2,ls=o.l||[z[0]],fs=o.fs||10;
  return `<rect class="z ${o.b?'b':''}" x="${z[1]}" y="${z[2]}" width="${z[3]}" height="${z[4]}" rx="7" data-z="${z[0]}"/><text ${o.rot?`transform="rotate(${o.rot} ${cx} ${cy})"`:''} text-anchor="middle" style="font-size:${fs}px">${ls.map((t,i)=>`<tspan x="${cx}" y="${cy+(i-(ls.length-1)/2)*(fs+2)+fs*.35}">${t}</tspan>`).join('')}</text>`}).join('')}
 <g id="${id}-pin"></g><text class="nrth" x="380" y="26" text-anchor="middle">N</text><path class="nrth-a" d="M380 30v14M376 35l4-5 4 5"/></svg><div class="pinlabel" id="${id}-lbl">${ic('pin')}<span>Tap the map to mark the spot</span></div><p class="hint" style="margin:4px 0 0">Simplified campus map, not to scale.</p>`}
function bindMap(id,cb){const svg=$('#'+id);if(!svg)return;
 const put=()=>{if(!S.pick)return;$('#'+id+'-pin').innerHTML=`<g class="pin"><path d="M0 0c0-9 7-9 7-16a7 7 0 0 0-14 0c0 7 7 7 7 16z" transform="translate(${S.pick.x} ${S.pick.y})" fill="var(--hot)" stroke="#fff" stroke-width="1.5"/><circle cx="${S.pick.x}" cy="${S.pick.y-16}" r="2.800" fill="#fff"/></g>`;$('#'+id+'-lbl span').textContent=S.pick.zone;$$('.z',svg).forEach(z=>z.classList.toggle('on',z.dataset.z===S.pick.zone))};
 svg.addEventListener('click',e=>{const r=svg.getBoundingClientRect(),x=Math.round((e.clientX-r.left)/r.width*400),y=Math.round((e.clientY-r.top)/r.height*430);S.pick={x,y,zone:zoneAt(x,y)};put();cb&&cb(S.pick)});put();return put}

const daysLeft=p=>Math.ceil((p.expiresAt-now())/DAY);

   <div class="row" style="margin-top:14px;flex-wrap:wrap"><button class="btn" id="qcopy">${ic('copy')}Copy link</button><button class="btn ghost" id="qdl">${ic('dl')}Save QR image</button></div>
   <p class="hint" style="margin-top:12px">Any student with a Google account can sign in and use the portal. Only emails on the staff allowlist can open the admin side.</p>`,(s,close)=>{
    const make=()=>{const q=$('#qr',s);q.innerHTML='';const v=$('#qu',s).value.trim();if(!v){q.innerHTML='<p class="hint" style="color:#555;margin:20px">Paste the link to create a QR code.</p>';return}

   ${i.sensitive&&i.status==='unclaimed'?`<div class="warn" style="margin:8px 0 0">Contact the owner directly using college records. Search the Students tab by name or roll number.</div>`:''}
   ${i.status==='expired'?`<div class="row" style="margin-top:8px;gap:8px"><select class="in" style="max-width:220px" data-disp="${i.id}"><option value="">Choose outcome</option>${['Donated','Disposed','Welfare fund'].map(o=>`<option ${i.disposition===o?'selected':''}>${o}</option>`).join('')}</select></div>`:''}</div>
   <div style="display:grid;gap:6px">${i.status==='unclaimed'&&i.sensitive?`<button class="btn sm" data-direct="${i.id}">Mark returned</button>`:''}<button class="btn ghost sm" data-del="${i.id}">Remove</button></div></div></article>`).join(''):empty('box','No items here','Log the first item with Add item, or change the filter.');
  $$('[data-del]').forEach(b=>b.onclick=()=>{if(b.dataset.s){delItem(b.dataset.del)}else{b.dataset.s=1;b.textContent='Confirm';b.classList.add('bad');setTimeout(()=>{if(b.isConnected){b.textContent='Remove';b.classList.remove('bad');delete b.dataset.s}},3000)}});
  $$('[data-disp]').forEach(s=>s.onchange=()=>updItem(s.dataset.disp,{disposition:s.value}));$$('[data-direct]').forEach(b=>b.onclick=()=>updItem(b.dataset.direct,{status:'returned'}).then(()=>toast('Marked returned')))}

  $('#q').oninput=e=>{S.q=e.target.value;drawItems()};$$('.chip').forEach(c=>c.onclick=()=>{S.filter=c.dataset.f;$$('.chip').forEach(x=>x.classList.toggle('on',x===c));drawItems()})};

async function delItem(id){await S.db.collection('itemPrivate').doc(id).delete();await S.db.collection('items').doc(id).delete().catch(()=>{});toast('Item removed')}
let sweeping=false;async function sweepExpiry(){if(sweeping||S.role!=='admin')return;const due=S.priv.filter(i=>i.status==='unclaimed'&&i.expiresAt<now());if(!due.length)return;sweeping=true;try{for(const i of due)await updItem(i.id,{status:'expired'});toast(`${due.length} item${due.length>1?'s':''} passed the holding period`)}catch(e){}sweeping=false}

   ${c.status==='requested'?`<div class="cmp"><div><small>${esc(it.q1||'Question 1')}</small>Student: <b>${esc(a.a1||'')}</b></div><div><small>Recorded answer</small><b class="${m1?'ok':'no'}">${esc(it.a1||'none')}</b> ${m1?'(matches)':'(differs)'}</div>${it.q2?`<div><small>${esc(it.q2)}</small>Student: <b>${esc(a.a2||'')}</b></div><div><small>Recorded answer</small><b>${esc(it.a2||'none')}</b></div>`:''}</div>`:''}
   <div class="row" style="margin-top:12px;gap:8px;flex-wrap:wrap">${nxt?`<button class="btn sm" data-act="${c.id}" data-to="${nxt[0]}">${nxt[1]}</button>`:''}${c.status==='requested'?`<button class="btn ghost sm" data-act="${c.id}" data-to="rejected">Reject</button>`:''}</div></article>`}).join('')}</div>`:empty('check','No claims yet','Claims appear here when students tap "This is mine".'))};

  if(to==='approved'||to==='ready')await updItem(c.itemId,{status:'claimed'});if(to==='rejected'&&!S.claims.some(x=>x.itemId===c.itemId&&x.id!==c.id&&['approved','ready'].includes(x.status)))await updItem(c.itemId,{status:'unclaimed'});toast('Claim '+to)}
const returnFor=c=>{const it=S.priv.find(i=>i.id===c.itemId);if(!it||!it.finderUid||it.returnLogged||it.pointsAwarded||it.finderUid===c.studentId)return null;return{uid:it.finderUid,name:(S.profiles.find(p=>p.uid===it.finderUid)||{}).name||it.finder,it}};

  await ref.set({...o,uid:r.uid,name:r.name,count:(o.count||0)+1,['log_'+r.it.id]:{desc:r.it.desc,at:now()}});await updItem(r.it.id,{returnLogged:true})}
function handoverModal(c){const p=S.profiles.find(x=>x.uid===c.studentId)||{},rw=returnFor(c);
  modal(`<h3>Record handover</h3><p class="hint">This entry is permanent and cannot be edited.</p><form id="hf" class="list" style="gap:12px;margin-top:12px"><div class="cmp"><div><small>Student</small>${esc(p.name||'')}</div><div><small>Roll number</small>${esc(p.roll||'')}</div></div>
   ${rw?`<div class="banner" style="margin:0">${ic('spark')}${esc(rw.name)} found this item. The return will be added to their history.</div>`:''}<label class="f">Released by<input class="in" id="hs" value="${esc(S.adminName)}" required></label><label style="display:flex;gap:10px;align-items:center;font-weight:600"><input type="checkbox" id="hid" required> College ID card checked against the student</label><button class="btn">Confirm handover</button></form>`,(s,close)=>{
   $('#hf',s).onsubmit=async e=>{e.preventDefault();const id=S.db.collection('handovers').doc().id;
    await S.db.collection('handovers').doc(id).set({id,claimId:c.id,itemId:c.itemId,itemDesc:c.itemDesc,roll:p.roll||'',studentName:p.name||'',by:$('#hs',s).value,idChecked:true,at:now()});
    await S.db.collection('claims').doc(c.id).update({status:'collected'});await updItem(c.itemId,{status:'returned'});try{await logReturn(c)}catch(e){console.error(e)}close();confetti();toast(rw?'Handover recorded. Added to the finder\'s history.':'Handover recorded')}})}

function drawStudents(){const q=($('#sq').value||'').toLowerCase().trim();const l=S.profiles.filter(p=>!q||(p.name+' '+p.roll).toLowerCase().includes(q));
  $('#slist').innerHTML=l.length?l.map((p,n)=>`<article class="card tilt rise" style="--i:${Math.min(n,8)}"><div class="row"><div class="av">${esc((p.name||'?')[0])}</div><div class="grow"><b>${esc(p.name)}</b><div class="meta"><span>${esc(p.roll)}</span><span>${esc(p.dept)}</span><span>${esc(p.year)}</span></div><div class="meta"><span>${esc(p.email)}</span><span>${esc(p.phone)}</span></div></div><span class="pill p-returned">${Object.keys(S.returns.find(x=>x.id===p.uid)||{}).filter(k=>k.startsWith('log_')).length} returned</span> <span class="pill p-claimed">${S.lost.filter(l=>l.studentId===p.uid).length} lost</span> <span class="pill p-new">${S.claims.filter(c=>c.studentId===p.uid).length} claims</span></div></article>`).join(''):empty('users',S.profiles.length?'No match':'No students yet','Students appear after their first Google sign-in and profile setup.')}
AFTER.students=()=>{$('#sq').oninput=drawStudents;drawStudents()};

/* ---------- matching (plain JavaScript) ----------
   For each open lost report, every unclaimed found item is scored and the best 3 are kept.
   SCORE  same category +3 | same place +2 | dates within 7 days +1 | each shared word of 4+ letters +2 (max 3 words = +6)
   Maximum score is 12. PERCENT = score / 12 * 100, rounded. A suggestion is made ONLY when percent >= 75 (score 9 or more). */
const MATCH={max:12,minPercent:75,top:3,weekMin:10080,maxTok:32,tokLen:32};
const mins=t=>{const v=new Date(t).getTime();return Number.isFinite(v)?Math.floor(v/6e4):-1e9};
const words=t=>{const out=[];for(const w of String(t??'').toLowerCase().match(/[a-z]{4,}/g)||[]){const k=w.slice(0,MATCH.tokLen-1);if(!out.includes(k)&&out.length<MATCH.maxTok)out.push(k)}return out};
const percentOf=s=>Math.floor((s*100+MATCH.max/2)/MATCH.max);
function scorePair(l,lw,it,iw){let s=0,w=0,shared=0;
  if(l.cat===it.cat){s+=3;w|=1}
  if(l.zone===it.loc){s+=2;w|=2}
  if(Math.abs(mins(l.when)-mins(it.foundAt))<=MATCH.weekMin){s+=1;w|=4}
  shared=Math.min(3,lw.filter(x=>iw.includes(x)).length);if(shared)w|=8;
  return{s:s+shared*2,w:w|(shared<<4)}}
function findMatches(open,items){
  const iw=items.map(i=>words((i.desc||'')+' '+(i.privateNote||'')));
  return open.map(l=>{const lw=words(l.desc);
    const c=items.map((it,n)=>({i:it,...scorePair(l,lw,it,iw[n])})).map(r=>({...r,p:percentOf(r.s)})).filter(r=>r.p>=MATCH.minPercent)
      .sort((a,b)=>b.s-a.s).slice(0,MATCH.top);   /* sort is stable, so earlier items win ties */
    return{l,c}}).filter(r=>r.c.length)}
const why=w=>[w&1?'Same category':'',w&2?'Same place':'',w&4?'Found within 7 days':'',w&8?(w>>4)+' matching word'+((w>>4)>1?'s':''):''].filter(Boolean).join(' · ');
VIEWS.matches=()=>{const open=S.lost.filter(l=>l.status==='open'),items=S.priv.filter(i=>i.status==='unclaimed');let res=[],note='';
  try{res=findMatches(open,items)}catch(e){console.error(e);note=`<div class="warn">Could not compute matches: ${esc(e.message)}</div>`}
  return head('Matches','Suggests a found item only when it is a 75% match or higher.')+note+
  `<div class="sec" style="margin-top:0">Likely matches</div>${res.length?`<div class="list">${res.map(({l,c})=>{const best=c[0];return `<article class="card rise"><div class="row"><div class="ic v">${ic('spark')}</div><div class="grow"><b>${esc(l.name)} lost: ${esc(l.desc)}</b><div class="meta"><span>${esc(l.cat)}</span><span>${ic('pin')}${esc(l.zone)}</span><span>${fmtDate(l.when)}</span></div></div><span class="pill p-new">${best.p}% match</span></div>
   <div class="cmp"><div><small>Best found item</small>${esc(best.i.desc)}</div><div><small>Stored at</small>${esc(best.i.storage||'')}${best.i.locked?' (locked)':''}</div></div><div class="hint">Why: ${esc(why(best.w))}</div>
   ${c.length>1?`<div class="hint" style="margin-top:6px">Other possible: ${c.slice(1).map(x=>esc(x.i.desc)+' ('+x.p+'%)').join(' · ')}</div>`:''}
   <div class="meta">Contact: ${esc((S.profiles.find(p=>p.uid===l.studentId)||{}).phone||'')} · ${esc((S.profiles.find(p=>p.uid===l.studentId)||{}).email||'')}</div><button class="btn sm" style="margin-top:10px" data-lost="${esc(l.id)}">Mark resolved</button></article>`}).join('')}</div>`:(note?'':'<p class="hint">No matches of 75% or higher right now.</p>')}`};
AFTER.matches=()=>{$$('[data-lost]').forEach(b=>b.onclick=async()=>{const l=S.lost.find(x=>x.id===b.dataset.lost);if(!l)return;b.disabled=true;
  try{await S.db.collection('lost').doc(l.studentId).update({[l.id]:{...l,status:'resolved'}});toast('Marked resolved')}catch(e){b.disabled=false;toast('Could not update the report')}})};

VIEWS.reports=()=>{const it=S.priv,by=k=>Object.entries(it.reduce((m,i)=>(m[i[k]]=(m[i[k]]||0)+1,m),{})).sort((a,b)=>b[1]-a[1]),cats=by('cat'),locs=by('loc'),mx=Math.max(1,...cats.map(x=>x[1]),...locs.map(x=>x[1]));
  const wk=it.filter(i=>now()-i.foundAt<7*DAY);const bars=a=>a.length?a.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div><i style="--w:${v/mx*100}%"></i></div><span>${v}</span></div>`).join(''):'<p class="hint">No data yet.</p>';
  return head('Monthly report','What gets lost most, and where.',`<button class="btn ghost sm" id="csv">${ic('dl')}Export CSV</button>`)+
  `<div class="grid2"><div class="card rise"><h3 style="font-size:18px">Most lost categories</h3>${bars(cats)}</div><div class="card rise"><h3 style="font-size:18px">Hotspots</h3>${bars(locs)}</div></div>
  <div class="card rise" style="margin-top:14px"><h3 style="font-size:18px">Weekly notice</h3><p class="hint">One notice for the week instead of many messages. Copy it into an email or post it on the portal.</p><textarea class="in" id="dg" readonly style="margin:10px 0">${esc(`Lost & Found: new items this week\n\n`+(wk.filter(i=>!i.sensitive).map(i=>`- ${i.cat}: ${i.desc} (found at ${i.loc}, ${fmtDate(i.date)})`).join('\n')||'- No new public items this week.')+`\n\nIf one is yours, open the portal and tap "This is mine". Bring your college ID to the admin office for pickup.`)}</textarea><button class="btn sm" id="cdg">${ic('copy')}Copy notice</button></div>`};
AFTER.reports=()=>{$('#cdg').onclick=async()=>{try{await navigator.clipboard.writeText($('#dg').value);toast('Notice copied')}catch(e){$('#dg').select();toast('Select and copy the text')}};
  $('#csv').onclick=async()=>{const rows=[['category','description','location','date','status','storage','finder'],...S.priv.map(i=>[i.cat,i.desc,i.loc,i.date,i.status,i.storage,i.finder])];const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
   try{await saveFile('lost-found-report.csv',csv);toast('Report saved')}catch(e){toast('Saving was cancelled or is unavailable here')}}};

VIEWS.settings=()=>head('Settings','Holding period and housekeeping.')+`<div class="card rise" style="max-width:560px"><label class="f">Holding period: <b id="hv" style="color:var(--brand);font-size:18px">${S.settings.holdDays} days</b><input type="range" id="hd" min="30" max="60" value="${S.settings.holdDays}" style="width:100%;accent-color:var(--brand)"></label><p class="hint" style="margin-top:10px">Applies to items logged from now on. Items still unclaimed after this period are marked Expired, and you choose to donate, dispose or send them to the welfare fund.</p><button class="btn" id="sv" style="margin-top:12px">Save</button></div>`;
AFTER.settings=()=>{$('#hd').oninput=e=>$('#hv').textContent=e.target.value+' days';$('#sv').onclick=async()=>{await S.db.doc('settings/main').set({holdDays:+$('#hd').value});toast('Settings saved')}};

boot();
